<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b1a2e;
    --panel: #14132a;
    --panel-edge: #4b4680;
    --wall: #33305a;
    --text: #efeaff;
    --muted: #a39fc7;
    --accent: #ffd166;
    --ok: #5ee6a0;
    --info: #6cb8ff;
    --warn: #ffb057;
    --bad: #ff5f7a;
    --p0: #ff3b5c; --p1: #ff7a45; --p2: #ffc53d; --p3: #7cc4ff; --p4: #b8b3d9;
    --bubble: #fffdf4;
    --bubble-text: #1b1a2e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "VT323", ui-monospace, monospace; font-size: 20px; line-height: 1.15; min-height: 100vh;
  }
  h1 { font-family: "Press Start 2P", ui-monospace, monospace; }

  /* ---------- header ---------- */
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 14px 16px; background: var(--panel); border-bottom: 4px solid var(--panel-edge);
  }
  h1 { font-size: 15px; margin: 0; color: var(--accent); letter-spacing: 1px; }
  .project { color: var(--muted); }
  .mode { font-family: "Press Start 2P", monospace; font-size: 9px; padding: 5px 7px; border: 2px solid currentColor; }
  .mode.live { color: var(--ok); } .mode.demo { color: var(--accent); } .mode.replay { color: var(--info); } .mode.off { color: var(--muted); }
  .counts { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .count { font-family: "Press Start 2P", monospace; font-size: 9px; padding: 6px 7px; background: #0c0b1d; border: 2px solid; }
  .count b { font-weight: normal; margin-left: 4px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  button, select {
    font: inherit; font-size: 18px; color: var(--text); background: #2d2a55; border: 2px solid var(--panel-edge);
    padding: 3px 10px; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- phase stepper ---------- */
  .phases { display: flex; gap: 4px; padding: 10px 16px; background: var(--wall); overflow-x: auto; }
  .phase {
    flex: 1 0 auto; text-align: center; padding: 6px 8px; font-size: 18px; color: var(--muted);
    background: #26234a; border-bottom: 4px solid #26234a; white-space: nowrap;
  }
  .phase.done { color: var(--ok); border-bottom-color: var(--ok); }
  .phase.now { color: var(--bubble-text); background: var(--accent); border-bottom-color: #c99a2e; }

  /* ---------- layout ---------- */
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .stage { min-width: 0; padding: 16px; }

  /* ---------- the office scene ---------- */
  .office-scroll { overflow-x: auto; border: 4px solid #0c0b1d; box-shadow: 6px 6px 0 #0c0b1d; }
  .office { position: relative; min-width: 640px; }
  .office canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
  .label, .bubble { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; }
  .label {
    font-size: 15px; line-height: 1; padding: 1px 4px 2px; background: rgba(12, 11, 29, 0.78); color: #fff; white-space: nowrap;
  }
  .label.working { color: var(--ok); } .label.found { color: #ff9aac; } .label.waiting { color: var(--accent); }
  .bubble {
    width: max-content; max-width: 150px; background: var(--bubble); color: var(--bubble-text);
    border: 2px solid #0c0b1d; padding: 2px 6px 3px; font-size: 16px; line-height: 1;
    box-shadow: 2px 2px 0 #0c0b1d; opacity: 0; transition: opacity 0.25s;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .bubble.show { opacity: 1; }
  .bubble.chat { background: #e9f6ff; border-radius: 8px; }
  .bubble.alert { background: #ffe1e6; }

  /* ---------- team roster ---------- */
  .team { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 16px; }
  .card { background: var(--panel); border: 2px solid var(--panel-edge); padding: 6px 9px; display: grid; grid-template-columns: 1fr auto; gap: 0 8px; }
  .card .name { font-size: 20px; color: var(--accent); }
  .card .role { grid-column: 1 / -1; font-size: 16px; color: var(--muted); }
  .card .status { font-size: 16px; display: flex; align-items: center; gap: 5px; justify-content: flex-end; }
  .card .findings { grid-column: 1 / -1; display: flex; gap: 3px; flex-wrap: wrap; min-height: 10px; margin-top: 3px; }
  .card .findings i { width: 10px; height: 10px; display: inline-block; }
  .dot { width: 8px; height: 8px; display: inline-block; background: var(--muted); }
  .st-working .dot { background: var(--ok); animation: blink 0.8s steps(2) infinite; }
  .st-found .dot { background: var(--bad); }
  .st-waiting .dot { background: var(--accent); animation: blink 1.2s steps(2) infinite; }
  .st-blocked .dot { background: var(--warn); }
  .st-done .dot { background: var(--info); }
  @keyframes blink { 50% { opacity: 0.2; } }

  /* ---------- feed ---------- */
  aside { background: var(--panel); border-left: 4px solid var(--panel-edge); display: flex; flex-direction: column; min-height: 0; }
  @media (max-width: 1000px) { aside { border-left: 0; border-top: 4px solid var(--panel-edge); } }
  aside h2 { font-family: "Press Start 2P", monospace; font-size: 10px; margin: 0; padding: 14px 14px 10px; color: var(--accent); }
  .feed { list-style: none; margin: 0; padding: 0 14px 14px; overflow-y: auto; max-height: calc(100vh - 170px); }
  @media (max-width: 1000px) { .feed { max-height: 360px; } }
  .feed li { padding: 6px 0 7px; border-bottom: 2px dashed #2d2a55; font-size: 18px; }
  .feed .who { color: var(--accent); }
  .feed .time { color: var(--muted); font-size: 15px; float: right; }
  .feed .sev { font-family: "Press Start 2P", monospace; font-size: 8px; padding: 2px 3px; color: #0c0b1d; margin-right: 4px; }
  .empty { color: var(--muted); padding: 10px 0; }
  .hint { color: var(--muted); font-size: 16px; margin: 8px 2px 0; }
  .swipe { display: none; }
  @media (max-width: 700px) { .swipe { display: inline; } }

  @media (prefers-reduced-motion: reduce) { .dot { animation: none !important; } }
</style>
</head>
<body>
<header>
  <h1>QA OFFICE</h1>
  <span class="project" id="project">Waiting for a QA run…</span>
  <span class="mode off" id="mode">OFFLINE</span>
  <div class="counts" id="counts"></div>
  <div class="controls">
    <select id="runs" aria-label="Choose a run to view"><option value="">Current run</option></select>
    <button id="replay" type="button">Replay</button>
    <button id="demo" type="button">Demo</button>
  </div>
</header>
<nav class="phases" id="phases" aria-label="QA phases"></nav>
<main>
  <section class="stage" aria-label="The QA team at work">
    <div class="office-scroll">
      <div class="office" id="office">
        <canvas id="scene" width="400" height="224" role="img" aria-label="Pixel-art office where the QA team works and takes breaks"></canvas>
      </div>
    </div>
    <p class="hint">Busy agents sit at their desks. Free agents take a break in the lounge and chat.<span class="swipe"> Swipe the office sideways to see the lounge.</span></p>
    <div class="team" id="team"></div>
  </section>
  <aside aria-label="Activity feed">
    <h2>ACTIVITY</h2>
    <ul class="feed" id="feed"></ul>
  </aside>
</main>

<script>
/* ============================================================
   Team
   ============================================================ */
const TEAM = [
  { id: "qa-lead", name: "Marcus", title: "QA Lead",
    look: { skin: "#c68a5a", hair: "#2a1b12", style: "short", shirt: "#3c4a8c", pants: "#2a2d45", acc: "tie", accColor: "#e0364f" },
    lines: ["Great work, team! 🙌", "Reproduce it twice, then report it", "Who wants coffee? My treat ☕", "No P0s on my watch!"] },
  { id: "functional-test-engineer", name: "Ben", title: "Functional Test Engineer",
    look: { skin: "#f1c7a0", hair: "#7a4a22", style: "short", shirt: "#2f9e6e", pants: "#3a3550", acc: "none" },
    lines: ["The Save button didn't save 💾", "I clicked every link. Twice.", "Forms are my cardio"] },
  { id: "exploratory-ux-tester", name: "Luna", title: "Exploratory UX Tester",
    look: { skin: "#e0a878", hair: "#c9432e", style: "long", shirt: "#f08bb4", pants: "#3b3a6b", acc: "beret", accColor: "#5b3f9e" },
    lines: ["A new user would be so lost here", "Empty states need love 💜", "Where does this button even go?"] },
  { id: "technical-qa-engineer", name: "Kofi", title: "Technical QA Engineer",
    look: { skin: "#8d5a3b", hair: "#15110e", style: "short", shirt: "#3a3f4b", pants: "#23252f", acc: "headphones", accColor: "#26d0ce" },
    lines: ["Console is clean… for now 🎧", "Hydration errors again?!", "I dream in stack traces"] },
  { id: "edge-case-test-engineer", name: "Jax", title: "Edge-Case Test Engineer",
    look: { skin: "#f5d0b0", hair: "#f2c230", style: "spiky", shirt: "#e8612c", pants: "#2e3a5c", acc: "none" },
    lines: ["I double-clicked it. Twice. 😈", "What if the name is 5,000 emojis?", "Back button mid-payment? Yes."] },
  { id: "api-test-engineer", name: "Omar", title: "API Test Engineer",
    look: { skin: "#d9a066", hair: "#3b2a20", style: "short", shirt: "#4e7fd6", pants: "#2c2f3f", acc: "glasses" },
    lines: ["That should be a 404, not a 500 🙃", "JSON for breakfast", "Who needs a UI? curl is life"] },
  { id: "application-security-tester", name: "Rin", title: "Application Security Tester",
    look: { skin: "#b5794c", hair: "#111", style: "short", shirt: "#23252f", pants: "#1a1b22", acc: "hood", accColor: "#23252f" },
    lines: ["I changed one ID in the URL 👀", "Never trust the client", "Is that token in localStorage?"] },
  { id: "data-integrity-analyst", name: "Mei", title: "Data Integrity & Access Control Analyst",
    look: { skin: "#f0bf94", hair: "#4a2c1a", style: "bun", shirt: "#8f5bd6", pants: "#35304f", acc: "glasses" },
    lines: ["Where did that record go? 🤔", "The counts don't add up…", "Logout means logout!"] },
  { id: "accessibility-specialist", name: "Amara", title: "Accessibility Specialist",
    look: { skin: "#6b4228", hair: "#0f0b09", style: "long", shirt: "#f2a33a", pants: "#3a2f4f", acc: "none" },
    lines: ["Can you close it with Esc? No? 😬", "Keyboard-only day! ⌨️", "Alt text is not optional"] },
  { id: "visual-qa-engineer", name: "Sofia", title: "Visual & Responsive QA Engineer",
    look: { skin: "#f3cfae", hair: "#e57fb0", style: "long", shirt: "#2bb3b1", pants: "#34406a", acc: "headband", accColor: "#ffffff" },
    lines: ["It overflows at 390px 📱", "Pixel-perfect or bust ✨", "Who approved this padding?"] },
  { id: "performance-test-engineer", name: "Diego", title: "Performance Test Engineer",
    look: { skin: "#a86b45", hair: "#1c140f", style: "short", shirt: "#d9433b", pants: "#2a2a3a", acc: "headband", accColor: "#ffd166" },
    lines: ["A 4MB hero image. Why. 🐢", "LCP under 2s, chef's kiss", "Every request counts ⏱️"] },
];
const SMALL_TALK = [
  "Works on my machine! 🤷", "Coffee first, then bugs ☕", "Tabs or spaces?", "It's not a bug, it's a feature!",
  "Have you tried turning it off and on?", "404: motivation not found", "Ship it! …after QA 🚢", "Friday deploy? Brave.",
  "Undefined is not a function… again", "Did anyone test on mobile?", "Clear cache, hard refresh!", "Lunch? 🍜",
  "My favorite color is #FF0000", "One more coffee and I'll find a P0",
];
const MENTIONS = ["{o}, want a coffee?", "Nice find earlier, {o}!", "{o}, did you see that bug?", "Ha! Good one, {o} 😂", "{o} is on fire today 🔥"];
const PHASES = [["discovery", "Discovery"], ["context", "Context"], ["setup", "Setup"], ["plan", "Plan"],
  ["testing", "Testing"], ["report", "Report"], ["fixing", "Fixing"], ["final", "Final"]];
const SEVS = ["P0", "P1", "P2", "P3", "P4"];
const byId = Object.fromEntries(TEAM.map((m) => [m.id, m]));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

/* ============================================================
   Office map (logical pixels, 400 x 224)
   ============================================================ */
const W = 400, H = 224, CORRIDOR = 280, SPEED = 58;
const AISLES = [26, 80, 140];
const DESKS = { "qa-lead": { x: 158, y: 44 } };
TEAM.slice(1).forEach((m, i) => { DESKS[m.id] = { x: [12, 68, 124, 180, 236][i % 5], y: i < 5 ? 100 : 160 }; });
for (const id in DESKS) { const d = DESKS[id]; d.seatX = d.x + 9; }

const HANGOUTS = {
  coffee: [{ x: 298, y: 54 }, { x: 314, y: 57 }, { x: 330, y: 53 }],
  cooler: [{ x: 372, y: 58 }, { x: 390, y: 62 }],
  sofa:   [{ x: 331, y: 108, sit: true }, { x: 348, y: 108, sit: true }, { x: 365, y: 108, sit: true }],
  table:  [{ x: 333, y: 172 }, { x: 367, y: 172 }, { x: 342, y: 199 }, { x: 360, y: 199 }],
  window: [{ x: 226, y: 30 }, { x: 244, y: 30 }],
};
const spotOwner = new Map();  // "hangout:index" -> agent id

/* ============================================================
   State
   ============================================================ */
const agents = {};
let phase = null, totals = {}, feedItems = [], feedDirty = true;

function initAgents() {
  const spots = [];
  for (const h in HANGOUTS) HANGOUTS[h].forEach((s, i) => spots.push({ h, i }));
  spots.sort(() => Math.random() - 0.5);
  spotOwner.clear();
  TEAM.forEach((m, idx) => {
    const sp = spots[idx % spots.length], s = HANGOUTS[sp.h][sp.i];
    agents[m.id] = {
      ...m, state: "idle", msg: "", findings: [], changedAt: -1e9, foundAt: -1e9,
      x: s.x, y: s.y, path: [], activity: "hanging", spot: sp, seat: s.sit ? "sofa" : null,
      hangUntil: performance.now() + rand(3000, 12000), facing: 0, talk: "", talkUntil: 0, walkT: 0,
    };
    spotOwner.set(sp.h + ":" + sp.i, m.id);
  });
}
function resetWork() {
  for (const id in agents) Object.assign(agents[id], { state: "idle", msg: "", findings: [], changedAt: -1e9, foundAt: -1e9 });
  phase = null;
  totals = Object.fromEntries(SEVS.map((s) => [s, 0]));
  feedItems = []; feedDirty = true;
}

function applyEvent(ev) {
  const now = performance.now();
  if (ev.state === "run") {
    resetWork();
    document.getElementById("project").textContent = ev.msg || "QA run";
    addFeed(ev, `Started a QA run${ev.msg ? " on " + ev.msg : ""}`);
    return;
  }
  const a = agents[ev.agent];
  if (!a) { addFeed(ev, ev.msg || ev.state); return; }
  if (ev.state === "phase") {
    phase = ev.phase || phase;
    if (a.state !== "working") a.changedAt = now;
    a.state = "working"; a.msg = ev.msg || "";
    addFeed(ev, ev.msg || `Phase: ${phase}`);
    return;
  }
  if (ev.state === "found") {
    const sev = SEVS.includes(ev.severity) ? ev.severity : "P3";
    a.findings.push(sev); totals[sev]++;
    a.foundAt = now; a.state = "working"; a.msg = `Found ${sev}: ${ev.msg}`;
    addFeed(ev, ev.msg, sev);
    return;
  }
  if (ev.state !== a.state) a.changedAt = now;
  a.state = ev.state; a.msg = ev.msg || "";
  if (ev.phase) phase = ev.phase;
  addFeed(ev, ev.msg || ev.state);
}

/* ============================================================
   Movement & behaviour
   ============================================================ */
const nearestAisle = (y) => AISLES.reduce((b, v) => (Math.abs(v - y) < Math.abs(b - y) ? v : b));
function route(ax, ay, bx, by) {
  const pts = [];
  const aDesk = ax < CORRIDOR, bDesk = bx < CORRIDOR;
  const ya = aDesk ? nearestAisle(ay) : ay, yb = bDesk ? nearestAisle(by) : by;
  if (aDesk) pts.push({ x: ax, y: ya });
  if (aDesk && bDesk && ya === yb) { pts.push({ x: bx, y: yb }); }
  else {
    pts.push({ x: CORRIDOR + (aDesk ? 0 : 0), y: ya });
    pts.push({ x: CORRIDOR, y: yb });
    pts.push({ x: bx, y: yb });
  }
  pts.push({ x: bx, y: by });
  return pts;
}
function goTo(a, x, y, activity) {
  a.path = route(a.x, a.y, x, y); a.activity = activity; a.seat = null;
}
function releaseSpot(a) {
  if (a.spot) { spotOwner.delete(a.spot.h + ":" + a.spot.i); a.spot = null; }
}
function chooseHangout(a) {
  releaseSpot(a);
  const free = [];
  for (const h in HANGOUTS) HANGOUTS[h].forEach((s, i) => { if (!spotOwner.has(h + ":" + i)) free.push({ h, i }); });
  if (!free.length) { goTo(a, rand(290, 395), rand(130, 150), "wander"); return; }
  // prefer hangouts where someone is already chatting
  const social = free.filter((f) => [...spotOwner.keys()].some((k) => k.startsWith(f.h + ":")));
  const sp = social.length && Math.random() < 0.75 ? pick(social) : pick(free);
  a.spot = sp; spotOwner.set(sp.h + ":" + sp.i, a.id);
  const s = HANGOUTS[sp.h][sp.i];
  goTo(a, s.x, s.y, "toHangout");
}
function wantsDesk(a, now) {
  if (["working", "blocked", "waiting"].includes(a.state)) return true;
  return a.state === "done" && now - a.changedAt < 2200;  // celebrate at the desk first
}

function update(a, now, dt) {
  const d = DESKS[a.id];
  const patrol = a.id === "qa-lead" && a.state === "working" && phase === "testing";
  if (patrol) {
    if (a.activity !== "patrolling" && a.activity !== "toPatrol" || (a.activity === "patrolling" && now > a.hangUntil)) {
      releaseSpot(a);
      const busy = TEAM.filter((m) => m.id !== a.id && agents[m.id].activity === "atDesk");
      if (busy.length) { const t = DESKS[pick(busy).id]; goTo(a, t.seatX + 14, nearestAisle(t.y - 20), "toPatrol"); }
      else if (a.activity !== "toDesk" && a.activity !== "atDesk") goTo(a, d.seatX, d.y, "toDesk");
    }
  } else if (wantsDesk(a, now)) {
    if (a.activity !== "toDesk" && a.activity !== "atDesk") { releaseSpot(a); goTo(a, d.seatX, d.y, "toDesk"); }
  } else if (["toDesk", "atDesk", "toPatrol", "patrolling"].includes(a.activity)) {
    chooseHangout(a);
  } else if (a.activity === "hanging" && now > a.hangUntil) {
    chooseHangout(a);
  } else if (a.activity === "wander" && !a.path.length && now > a.hangUntil) {
    chooseHangout(a);
  }

  // walk
  if (a.path.length) {
    const p = a.path[0], dx = p.x - a.x, dy = p.y - a.y, dist = Math.hypot(dx, dy), step = SPEED * dt;
    if (dist <= step) { a.x = p.x; a.y = p.y; a.path.shift(); } else { a.x += (dx / dist) * step; a.y += (dy / dist) * step; }
    a.facing = Math.abs(dx) > 0.5 ? Math.sign(dx) : 0;
    a.walkT += dt;
    if (!a.path.length) arrive(a, now);
  }
}
function arrive(a, now) {
  a.facing = 0;
  if (a.activity === "toDesk") { a.activity = "atDesk"; a.seat = "desk"; }
  else if (a.activity === "toHangout") {
    a.activity = "hanging"; a.hangUntil = now + rand(9000, 18000);
    a.seat = a.spot && HANGOUTS[a.spot.h][a.spot.i].sit ? "sofa" : null;
    if (a.state === "done" && a.findings.length) say(a, `Done! ${a.findings.length} bug${a.findings.length > 1 ? "s" : ""} found 🐛`, now);
  }
  else if (a.activity === "toPatrol") { a.activity = "patrolling"; a.hangUntil = now + rand(3500, 6000); say(a, pick(["Looking good!", "How's it going?", "Nice, keep going 👍", "Found anything?"]), now); }
  else if (a.activity === "wander") { a.hangUntil = now + rand(3000, 6000); }
}
function say(a, text, now) { a.talk = text; a.talkUntil = now + 3000; }

let nextChat = 0;
function chatter(now) {
  if (now < nextChat) return;
  nextChat = now + rand(1600, 3200);
  const groups = {};
  for (const id in agents) {
    const a = agents[id];
    if (a.activity === "hanging" && a.spot && now > a.talkUntil) (groups[a.spot.h] ||= []).push(a);
  }
  const social = Object.values(groups).filter((g) => g.length >= 1 && Object.values(agents).filter((o) => o.activity === "hanging" && o.spot && o.spot.h === g[0].spot.h).length >= 2);
  if (!social.length) return;
  const g = pick(social), a = pick(g);
  const others = Object.values(agents).filter((o) => o !== a && o.spot && o.spot.h === a.spot.h && o.activity === "hanging");
  const other = pick(others);
  const r = Math.random();
  let text = r < 0.4 ? pick(a.lines) : r < 0.65 ? pick(MENTIONS).replace("{o}", other.name) : pick(SMALL_TALK);
  say(a, text, now);
  // face each other
  a.facing = Math.sign(other.x - a.x); other.facing = Math.sign(a.x - other.x);
}

/* ============================================================
   Drawing
   ============================================================ */
const cv = document.getElementById("scene"), ctx = cv.getContext("2d");
function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16), f = (v) => Math.max(0, Math.min(255, Math.round(v * (1 + amt))));
  return "#" + [f(n >> 16), f((n >> 8) & 255), f(n & 255)].map((v) => v.toString(16).padStart(2, "0")).join("");
}
function seedRand(seed) { let s = seed; return () => ((s = (s * 9301 + 49297) % 233280) / 233280); }

function drawRoom(t) {

  R(0, 20, W, H - 20, "#6b4a35");
  for (let y = 20; y < H; y += 6) { R(0, y, CORRIDOR + 4, 1, "#5d3f2d"); for (let x = (y / 6) % 2 ? 0 : 20; x < CORRIDOR + 4; x += 40) R(x, y, 1, 6, "#5d3f2d"); }
  R(CORRIDOR + 4, 20, W - CORRIDOR - 4, H - 20, "#3f5a6e");
  for (let y = 22; y < H; y += 4) for (let x = CORRIDOR + 6 + (y % 8 ? 2 : 0); x < W; x += 4) R(x, y, 1, 1, "#46637a");
  R(308, 120, 84, 44, "#b0584a"); R(310, 122, 80, 40, "#c56b5b");  // rug
  for (let x = 314; x < 388; x += 8) R(x, 141, 4, 2, "#e0a36a");
  // wall
  R(0, 0, W, 20, "#4a4478"); R(0, 18, W, 2, "#2f2a55");

  // clock
  R(262, 4, 10, 10, "#26213f"); R(263, 5, 8, 8, "#fff"); R(266, 6, 1, 3, "#333");

}

function drawScreen(a, x, y, t) {
  const found = t - a.foundAt < 3000, S = a.state, w = 9, h = 7;
  if (found && Math.floor(t / 250) % 2 === 0) { R(x, y, w, h, "#b3203c"); R(x + 4, y + 1, 1, 3, "#fff"); R(x + 4, y + 5, 1, 1, "#fff"); return; }
  if (a.activity === "atDesk" && (S === "working")) {
    R(x, y, w, h, "#0d3b2c");
    const rnd = seedRand(a.id.length * 31 + Math.floor(t / 180));
    for (let r = 0; r < h; r++) R(x + 1, y + r, 1 + Math.floor(rnd() * 7), 1, r % 3 ? "#5ee6a0" : "#b7ffd9");
    return;
  }
  if (S === "done") { R(x, y, w, h, "#18407a"); const c = "#8fd0ff"; R(x + 2, y + 3, 1, 1, c); R(x + 3, y + 4, 1, 1, c); R(x + 4, y + 3, 1, 1, c); R(x + 5, y + 2, 1, 1, c); R(x + 6, y + 1, 1, 1, c); return; }
  if (S === "waiting") { R(x, y, w, h, "#4a3b0c"); if (Math.floor(t / 400) % 2) { R(x + 3, y + 1, 3, 1, "#ffd166"); R(x + 5, y + 2, 1, 1, "#ffd166"); R(x + 4, y + 3, 1, 1, "#ffd166"); R(x + 4, y + 5, 1, 1, "#ffd166"); } return; }
  if (S === "blocked") { R(x, y, w, h, "#5a2d0c"); R(x + 2, y + 3, 5, 2, "#ffb057"); return; }
  R(x, y, w, h, "#161528"); R(x + 1, y + 1, 2, 1, "#2b2950");
}

// Head + torso of a character. (cx, top) = centre x and top of the head row.
function drawUpper(a, cx, top, t, typing) {
  const L = a.look, ox = cx - 12, oy = top - 3, f = a.facing || 0;
  const found = t - a.foundAt < 3000;
  if (L.acc === "hood") { R(ox + 6, oy + 2, 12, 10, L.accColor); R(ox + 6, oy + 2, 12, 1, shade(L.accColor, 0.3)); }
  // torso
  R(ox + 7, oy + 11, 10, 8, L.shirt); R(ox + 7, oy + 11, 10, 1, shade(L.shirt, 0.15));
  if (L.acc === "tie") { R(ox + 11, oy + 11, 2, 1, "#fff"); R(ox + 11, oy + 12, 2, 5, L.accColor); }
  // head
  R(ox + 7, oy + 3, 10, 8, L.skin); R(ox + 7, oy + 10, 10, 1, shade(L.skin, -0.12));
  const Hc = L.hair;
  if (L.acc !== "hood") {
    if (L.style === "long") { R(ox + 6, oy + 3, 2, 10, Hc); R(ox + 16, oy + 3, 2, 10, Hc); }
    R(ox + 7, oy + 2, 10, 2, Hc); R(ox + 7, oy + 4, 1, 2, Hc); R(ox + 16, oy + 4, 1, 2, Hc);
    if (L.style === "spiky") { R(ox + 8, oy + 1, 1, 1, Hc); R(ox + 10, oy, 1, 2, Hc); R(ox + 12, oy + 1, 1, 1, Hc); R(ox + 14, oy, 1, 2, Hc); }
    if (L.style === "bun") R(ox + 10, oy, 4, 2, Hc);
  } else R(ox + 8, oy + 3, 8, 1, Hc);
  if (L.acc === "beret") { R(ox + 6, oy + 1, 11, 2, L.accColor); R(ox + 14, oy, 2, 1, L.accColor); }
  if (L.acc === "headband") R(ox + 7, oy + 4, 10, 1, L.accColor);
  if (L.acc === "headphones") { R(ox + 7, oy + 1, 10, 1, "#222"); R(ox + 6, oy + 1, 1, 4, "#222"); R(ox + 17, oy + 1, 1, 4, "#222"); R(ox + 5, oy + 5, 2, 4, L.accColor); R(ox + 17, oy + 5, 2, 4, L.accColor); }
  // eyes look in the walking/talking direction
  const blink = ((t + a.id.length * 997) % 3600) < 130, eye = "#1b1a2e";
  if (!blink) { R(ox + 9 + f, oy + 6, 1, 2, eye); R(ox + 14 + f, oy + 6, 1, 2, eye); } else { R(ox + 9 + f, oy + 7, 1, 1, eye); R(ox + 14 + f, oy + 7, 1, 1, eye); }
  if (L.acc === "glasses") { const g = "#1b1a2e"; R(ox + 8, oy + 5, 3, 1, g); R(ox + 13, oy + 5, 3, 1, g); R(ox + 11, oy + 6, 2, 1, g); R(ox + 8, oy + 8, 3, 1, g); R(ox + 13, oy + 8, 3, 1, g); R(ox + 8, oy + 6, 1, 2, g); R(ox + 15, oy + 6, 1, 2, g); }
  const m = shade(L.skin, -0.45), talking = t < a.talkUntil && Math.floor(t / 160) % 2;
  if (a.state === "done" || (talking === 0 && t < a.talkUntil)) { R(ox + 10, oy + 8, 1, 1, m); R(ox + 11, oy + 9, 2, 1, m); R(ox + 13, oy + 8, 1, 1, m); }
  else if (found || talking) R(ox + 11, oy + 8, 2, 2, m);
  else if (a.state === "blocked") { R(ox + 11, oy + 9, 2, 1, m); R(ox + 10, oy + 10, 1, 1, m); R(ox + 13, oy + 10, 1, 1, m); }
  else R(ox + 11, oy + 9, 2, 1, m);
  // arms
  const arm = shade(L.shirt, -0.12);
  if (typing) {
    const tick = Math.floor(t / 140) % 2;
    R(ox + 5, oy + 12, 2, 5, arm); R(ox + 17, oy + 12, 2, 5, arm);
    R(ox + 6, oy + 17 - (tick ? 1 : 0), 3, 1, L.skin); R(ox + 15, oy + 17 - (tick ? 0 : 1), 3, 1, L.skin);
  } else { R(ox + 5, oy + 12, 2, 6, arm); R(ox + 17, oy + 12, 2, 6, arm); R(ox + 5, oy + 18, 2, 1, L.skin); R(ox + 17, oy + 18, 2, 1, L.skin); }
}

function drawStanding(a, t) {
  const walking = a.path.length > 0, L = a.look;
  const cx = Math.round(a.x), fy = Math.round(a.y);
  const bounce = walking && Math.floor(a.walkT * 8) % 2 ? -1 : 0;
  const jump = a.state === "done" && t - a.changedAt < 1500 ? -Math.round(Math.abs(Math.sin((t - a.changedAt) / 140)) * 2) : 0;
  const top = fy - 19 + bounce + jump;
  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.fillRect(cx - 5, fy - 1, 10, 2);
  // legs
  const step = walking ? Math.floor(a.walkT * 8) % 2 : -1;
  const P = L.pants;
  R(cx - 4, top + 16, 3, step === 0 ? 3 : 4, P); R(cx + 1, top + 16, 3, step === 1 ? 3 : 4, P);
  R(cx - 4, top + (step === 0 ? 19 : 20), 3, 1, "#1b1a2e"); R(cx + 1, top + (step === 1 ? 19 : 20), 3, 1, "#1b1a2e");
  drawUpper(a, cx, top, t, false);
}
function drawSeated(a, cx, surfaceY, t, typing) {
  const jump = a.state === "done" && t - a.changedAt < 1500 ? -Math.round(Math.abs(Math.sin((t - a.changedAt) / 140)) * 2) : 0;
  const hop = t - a.foundAt < 600 ? -1 : 0;
  drawUpper(a, cx, surfaceY - 16 + jump + hop, t, typing);
}

function drawDesk(id, t) {
  const d = DESKS[id], a = agents[id], x = d.x, y = d.y;
  R(x + 2, y - 13, 15, 12, "#3b3560"); R(x + 2, y - 13, 15, 1, "#4d467a");  // chair
  if (a.activity === "atDesk") drawSeated(a, d.seatX, y, t, a.state === "working");
  R(x, y, 30, 2, "#a8693c"); R(x, y, 30, 1, "#c98a55");                    // desk top
  R(x + 1, y + 2, 28, 9, "#7a4a28"); R(x + 1, y + 2, 28, 1, "#5d3820"); R(x + 12, y + 5, 6, 1, "#c98a55");
  R(x + 3, y - 1, 12, 1, "#d6d3e8");                                          // keyboard
  R(x + 18, y - 11, 11, 10, "#26243a"); R(x + 22, y - 1, 3, 1, "#26243a");    // monitor
  drawScreen(a, x + 19, y - 10, t);
  R(x + 1, y - 3, 2, 3, "#f4f1ff");                                           // mug
  // name tag on the desk front
  R(x + 8, y + 7, 14, 3, "#e8dcc0");
}

const GLYPHS = {
  "!": ["1", "1", "1", "0", "1"], "?": ["111", "001", "010", "000", "010"],
  "v": ["00001", "00010", "10100", "01000"], ".": ["000000", "000000", "101010"],
};
function emote(a, cx, headTop, t) {
  const found = t - a.foundAt < 3000;
  let g = null, c = null;
  if (found) { g = "!"; c = "#ff3b5c"; }
  else if (a.state === "waiting") { g = "?"; c = "#e0a800"; }
  else if (a.state === "done" && t - a.changedAt < 4000) { g = "v"; c = "#2fbf71"; }
  else if (a.state === "blocked") { g = "."; c = "#e07b00"; }
  if (!g) return;
  const rows = GLYPHS[g], w = rows[0].length, h = rows.length;
  const bx = cx - Math.ceil(w / 2) - 1 + 9, by = headTop - h - 4 + (Math.floor(t / 300) % 2 ? -1 : 0);
  R(bx - 1, by - 1, w + 2, h + 2, "#fff");
  rows.forEach((r, j) => [...r].forEach((v, i) => { if (v === "1") R(bx + i, by + j, 1, 1, c); }));
}

function render(t) {
  ctx.clearRect(0, 0, W, H);
  drawRoom(t);
  const items = [];
  for (const id in DESKS) items.push({ y: DESKS[id].y + 11, draw: () => drawDesk(id, t) });
  items.push({ y: 40, draw: () => drawCoffee(t) }, { y: 46, draw: () => drawCooler(t) }, { y: 189, draw: drawTable });
  items.push({ y: 114, draw: () => {
    drawSofaBack();
    for (const id in agents) { const a = agents[id]; if (a.seat === "sofa" && !a.path.length) drawSeated(a, a.x, 104, t, false); }
    drawSofaFront();
  } });
  for (const id in agents) { const a = agents[id]; if (a.activity !== "atDesk" && !(a.seat === "sofa" && !a.path.length)) items.push({ y: a.y, draw: () => drawStanding(a, t) }); }
  items.sort((p, q) => p.y - q.y).forEach((it) => it.draw());
  for (const id in agents) { const a = agents[id]; emote(a, ...anchor(a, t), t); }
}
function anchor(a, t) {  // [centre x, head top] of each character, for emotes and overlays
  if (a.activity === "atDesk") return [DESKS[a.id].seatX, DESKS[a.id].y - 16];
  if (a.seat === "sofa" && !a.path.length) return [a.x, 104 - 16];
  return [a.x, a.y - 19];
}

const office = document.getElementById("office");
const overlays = {};
TEAM.forEach((m) => {
  const label = document.createElement("div"); label.className = "label"; label.textContent = m.name;
  const bubble = document.createElement("div"); bubble.className = "bubble"; bubble.setAttribute("aria-live", "polite");
  office.append(label, bubble);
  overlays[m.id] = { label, bubble, lastText: null };
});
function renderOverlays(t) {
  const s = office.clientWidth / W;
  for (const id in agents) {
    const a = agents[id], o = overlays[id], [cx, top] = anchor(a, t);
    const found = t - a.foundAt < 3000;
    o.label.style.transform = `translate(${cx * s}px, ${(top - 3) * s}px) translate(-50%, -100%)`;
    o.label.className = "label " + (found ? "found" : a.activity === "atDesk" ? a.state : "");
    const chatting = t < a.talkUntil;
    const workMsg = a.activity === "atDesk" && a.msg && (a.state === "working" || a.state === "waiting" || a.state === "blocked");
    const text = chatting ? a.talk : workMsg ? a.msg : "";
    if (o.lastText !== text) { if (text) o.bubble.textContent = text; o.lastText = text; }
    o.bubble.classList.toggle("show", !!text);
    o.bubble.classList.toggle("chat", chatting);
    o.bubble.classList.toggle("alert", !chatting && found);
    o.bubble.style.transform = `translate(${cx * s}px, ${(top - 3) * s - 20}px) translate(-50%, -100%)`;
  }
}

const STATE_LABEL = { idle: "On a break", working: "Working", found: "Found a bug!", waiting: "Waiting for you", blocked: "Blocked", done: "Done" };
const teamEl = document.getElementById("team"), cards = {};
TEAM.forEach((m) => {
  const c = document.createElement("div"); c.className = "card";
  c.innerHTML = `<span class="name">${m.name}</span><span class="status"><span class="dot"></span><span class="st"></span></span><span class="role">${m.title}</span><span class="findings"></span>`;
  teamEl.appendChild(c); cards[m.id] = { el: c, st: c.querySelector(".st"), fi: c.querySelector(".findings"), key: "" };
});
function renderCards(t) {
  for (const id in agents) {
    const a = agents[id], c = cards[id];
    const shown = t - a.foundAt < 3000 ? "found" : a.state;
    const key = shown + a.findings.length;
    if (c.key === key) continue;
    c.key = key; c.el.className = "card st-" + shown; c.st.textContent = STATE_LABEL[shown] || shown;
    c.fi.innerHTML = a.findings.map((v) => `<i title="${v}" style="background:var(--${v.toLowerCase()})"></i>`).join("");
  }
}
function rebuildBadges() {
  document.getElementById("counts").innerHTML = SEVS.map((s) =>
    `<span class="count" style="border-color:var(--${s.toLowerCase()});color:var(--${s.toLowerCase()})">${s}<b>${totals[s]}</b></span>`).join("");
  const idx = PHASES.findIndex((p) => p[0] === phase);
  document.getElementById("phases").innerHTML = PHASES.map(([, label], i) =>
    `<div class="phase ${i < idx ? "done" : i === idx ? "now" : ""}">${label}</div>`).join("");
}
function addFeed(ev, text, sev) {
  const m = byId[ev.agent];
  feedItems.unshift({ who: m ? m.name : ev.agent, text, sev, time: (ev.t || "").slice(11, 16) });
  if (feedItems.length > 200) feedItems.length = 200;
  feedDirty = true;
}
function renderFeed() {
  if (!feedDirty) return;
  feedDirty = false;
  const ul = document.getElementById("feed");
  if (!feedItems.length) { ul.innerHTML = `<li class="empty">No activity yet. Type /qa in Claude Code, or press Demo.</li>`; return; }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  ul.innerHTML = feedItems.map((f) => `<li><span class="time">${f.time}</span><span class="who">${esc(f.who)}</span>: ${
    f.sev ? `<span class="sev" style="background:var(--${f.sev.toLowerCase()})">${f.sev}</span>` : ""}${esc(f.text)}</li>`).join("");
}

/* ============================================================
   Data sources: live polling, replay, demo
   ============================================================ */
let mode = "off", since = 0, pollTimer = null, playTimer = null, selectedRun = "";
function setMode(m, label) { mode = m; const el = document.getElementById("mode"); el.className = "mode " + m; el.textContent = label; }
function stopAll() { clearTimeout(pollTimer); clearTimeout(playTimer); }

async function poll() {
  try {
    const r = await fetch(`events?since=${since}${selectedRun ? "&run=" + encodeURIComponent(selectedRun) : ""}`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    if (data.total < since) { since = 0; resetWork(); }
    if (since === 0 && !data.events.length) document.getElementById("project").textContent = `${data.project}: waiting for /qa…`;
    data.events.forEach(applyEvent);
    if (data.events.length) rebuildBadges();
    since = data.total;
    if (mode !== "live") setMode("live", selectedRun ? "SAVED RUN" : "LIVE");
    if (!selectedRun) pollTimer = setTimeout(poll, 1000);
  } catch {
    if (mode === "live" || mode === "off") setMode("off", "OFFLINE");
    pollTimer = setTimeout(poll, 3000);
  }
}
async function loadRuns() {
  try {
    const runs = await (await fetch("runs", { cache: "no-store" })).json();
    document.getElementById("runs").innerHTML = `<option value="">Current run</option>` +
      runs.map((r) => `<option value="${r}">${r.replace(".jsonl", "").replace("_", " ")}</option>`).join("");
  } catch {}
}
function play(events, label) {
  stopAll(); resetWork(); rebuildBadges(); setMode(label === "DEMO" ? "demo" : "replay", label);
  let i = 0;
  const step = () => {
    if (i >= events.length) { setMode(label === "DEMO" ? "demo" : "replay", label + " DONE"); return; }
    const d = new Date();
    applyEvent({ ...events[i], t: events[i].t || d.toISOString().slice(0, 11) + d.toTimeString().slice(0, 8) });
    rebuildBadges(); i++;
    playTimer = setTimeout(step, events[i - 1].state === "found" ? 2200 : 1600);
  };
  step();
}
async function replay() {
  try {
    const r = await fetch(`events?since=0${selectedRun ? "&run=" + encodeURIComponent(selectedRun) : ""}`, { cache: "no-store" });
    const data = await r.json();
    if (data.events.length) play(data.events, "REPLAY"); else alert("Nothing to replay yet.");
  } catch { alert("Replay needs the QA Office server (python qa_office.py)."); }
}
function demoEvents() {
  const E = (agent, state, msg, extra = {}) => ({ agent, state, msg, ...extra });
  return [
    E("qa-lead", "run", "demo-saas-app"),
    E("qa-lead", "phase", "Reading README, schema and recent changes", { phase: "discovery" }),
    E("qa-lead", "phase", "Here's what I think this app does", { phase: "context" }),
    E("qa-lead", "waiting", "Waiting for your answers in the form"),
    E("qa-lead", "phase", "Got it! Setting up target and scope", { phase: "setup" }),
    E("qa-lead", "phase", "Writing the test plan: 42 scenarios", { phase: "plan" }),
    E("qa-lead", "phase", "Team, let's go! Testing starts now", { phase: "testing" }),
    E("technical-qa-engineer", "working", "Watching the console on /dashboard"),
    E("application-security-tester", "working", "Reviewing route protection"),
    E("api-test-engineer", "working", "Mapping 14 API routes"),

initAgents(); resetWork(); rebuildBadges();
document.getElementById("demo").onclick = () => play(demoEvents(), "DEMO");
document.getElementById("replay").onclick = replay;
document.getElementById("runs").onchange = (e) => { selectedRun = e.target.value; stopAll(); since = 0; resetWork(); rebuildBadges(); poll(); };

let last = performance.now();
(function loop(t) {
  t = t || performance.now();
  // Catch up in small steps if the browser throttled frames (e.g. background tab)
  let dt = Math.min(5, (t - last) / 1000); last = t;
  while (dt > 0) { const s = Math.min(0.05, dt); for (const id in agents) update(agents[id], t, s); dt -= s; }
  chatter(t);
  render(t); renderOverlays(t); renderCards(t); renderFeed();
  requestAnimationFrame(loop);
})();

const params = new URLSearchParams(location.search);
if (params.has("demo") || location.protocol === "file:") play(demoEvents(), "DEMO");
else { poll(); loadRuns(); }
